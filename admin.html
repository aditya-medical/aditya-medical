<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getAuth,
  signInWithEmailAndPassword
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
  getFirestore,
  collection,
  addDoc,
  getDocs,
  deleteDoc,
  doc
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "aditya-medico.firebaseapp.com",
  projectId: "aditya-medico",
  storageBucket: "aditya-medico.firebasestorage.app",
  messagingSenderId: "733161976762",
  appId: "1:733161976762:web:df982e69a1015cc52c6383"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

/* LOGIN */

window.login = async function () {

  try {

    await signInWithEmailAndPassword(
      auth,
      document.getElementById("email").value,
      document.getElementById("password").value
    );

    document.getElementById("loginBox").style.display = "none";
    document.getElementById("adminPanel").style.display = "block";

    loadMedicines();

    alert("Login Success");

  } catch (e) {

    alert(e.message);

  }

};

document.getElementById("loginBtn")
.addEventListener("click", window.login);

/* ADD MEDICINE */

window.addMedicine = async function () {

  try {

    const medicineData = {
      name: document.getElementById("name").value,
      price: document.getElementById("price").value,
      discount: document.getElementById("discount").value,
      category: document.getElementById("category").value,
      image: document.getElementById("image").value
    };

    await addDoc(
      collection(db, "medicines"),
      medicineData
    );

    alert("Medicine Added Successfully");

    loadMedicines();

    document.getElementById("name").value = "";
    document.getElementById("price").value = "";
    document.getElementById("discount").value = "";
    document.getElementById("category").value = "";
    document.getElementById("image").value = "";

  } catch (e) {

    console.error(e);
    alert(e.message);

  }

};

/* LOAD MEDICINES */

window.loadMedicines = async function () {

  const search =
    document.getElementById("search").value.toLowerCase();

  const snap =
    await getDocs(collection(db, "medicines"));

  let html = "";

  snap.forEach((d) => {

    const m = d.data();

    if (
      !(m.name || "")
      .toLowerCase()
      .includes(search)
    ) return;

    html += `
      <div class="medicine-card">

        <img src="${m.image}" alt="${m.name}">

        <h3>${m.name}</h3>

        <p>${m.category}</p>

        <p>
          <span class="price">
            ₹${m.price}
          </span>
        </p>

        <p class="discount">
          ₹${m.discount}
        </p>

        <button
          class="delete-btn"
          onclick="deleteMedicine('${d.id}')">
          🗑 Delete
        </button>

      </div>
    `;

  });

  document.getElementById("medicineList").innerHTML = html;

};

/* DELETE MEDICINE */

window.deleteMedicine = async function (id) {

  if (!confirm("Delete Medicine?")) return;

  await deleteDoc(
    doc(db, "medicines", id)
  );

  loadMedicines();

};

</script>
