<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aditya Medico</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: url('https://images.unsplash.com/photo-1580281657527-47b0a6f3d5a5') no-repeat center/cover;
  color: #333;
}

/* overlay */
.overlay {
  background: rgba(0,0,0,0.6);
  min-height: 100vh;
}

/* header */
header {
  background: #0f9d58;
  color: white;
  padding: 15px;
  text-align: center;
  font-size: 22px;
  font-weight: bold;
}

/* info box */
.info {
  text-align: center;
  padding: 10px;
  color: #fff;
}

/* search */
.search-box {
  display: flex;
  justify-content: center;
  margin: 15px;
}

.search-box input {
  width: 60%;
  padding: 10px;
  border: none;
  border-radius: 5px 0 0 5px;
}

.search-box button {
  padding: 10px;
  border: none;
  background: #ff9800;
  color: white;
  border-radius: 0 5px 5px 0;
}

/* products */
.products {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 15px;
  padding: 20px;
}

.card {
  background: white;
  border-radius: 10px;
  padding: 10px;
  text-align: center;
}

.card img {
  width: 100%;
  height: 120px;
  object-fit: cover;
}

.btn {
  margin-top: 10px;
  background: #0f9d58;
  color: white;
  padding: 8px;
  border: none;
  border-radius: 5px;
}

/* footer */
footer {
  text-align: center;
  background: black;
  color: white;
  padding: 10px;
}
</style>

</head>

<body>

<div class="overlay">

<header>Aditya Medico</header>

<div class="info">
📞 8825253574 <br>
📍 Behind Pal Satabdi Mall, Windsome Park Rd, Saguna More, Danapur, Patna - 801503
</div>

<div class="search-box">
<input type="text" placeholder="Search medicine...">
<button>Search</button>
</div>

<div class="products">

<div class="card">
<img src="https://via.placeholder.com/150">
<h4>Paracetamol</h4>
<p>₹30</p>
<button class="btn">Order</button>
</div>

<div class="card">
<img src="https://via.placeholder.com/150">
<h4>Cough Syrup</h4>
<p>₹120</p>
<button class="btn">Order</button>
</div>

<div class="card">
<img src="https://via.placeholder.com/150">
<h4>Vitamin Tablets</h4>
<p>₹80</p>
<button class="btn">Order</button>
</div>

<div class="card">
<img src="https://via.placeholder.com/150">
<h4>ORS</h4>
<p>₹20</p>
<button class="btn">Order</button>
</div>

</div>

<footer>
© 2026 Aditya Medico | All Rights Reserved
</footer>

</div>

</body>
</html>
