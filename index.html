<!DOCTYPE html>
<html>
<head>
  <title>Medical Store</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  🏥 My Medical Store
</header>

<div class="container">

  <div class="card">
    <h3>Paracetamol</h3>
    <p>Fever & pain relief</p>
    <button onclick="addToCart('Paracetamol')">Add to Cart</button>
  </div>

  <div class="card">
    <h3>Cough Syrup</h3>
    <p>Cold & cough relief</p>
    <button onclick="addToCart('Cough Syrup')">Add to Cart</button>
  </div>

</div>

<h2>🛒 Cart</h2>
<ul id="cart"></ul>

<h3>📦 Order</h3>
<input id="name" placeholder="Your Name">
<input id="phone" placeholder="mobile number">
<input id="address" placeholder="Address">
<button onclick="placeOrder()">Place Order</button>

<script src="script.js"></script>
<h2>🏠 Home Service Available</h2>
<p>Injection 💉 | IV Drip 💧 | Basic Treatment at Home</p>
</body>
</html>
