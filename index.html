<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aditya Medico</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: url('https://images.unsplash.com/photo-1580281657521-1f0c6a6e3b1b') no-repeat center center/cover;
    color: white;
}

/* overlay */
.overlay {
    background: rgba(0,0,0,0.7);
    min-height: 100vh;
    padding: 20px;
}

/* header */
header {
    text-align: center;
    padding: 20px;
}

header h1 {
    font-size: 35px;
    color: #00ffcc;
}

/* info box */
.info {
    background: rgba(255,255,255,0.1);
    padding: 15px;
    border-radius: 10px;
    margin: 20px;
    text-align: center;
}

/* medicines */
.products {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px,1fr));
    gap: 15px;
    padding: 20px;
}

.card {
    background: rgba(255,255,255,0.1);
    padding: 10px;
    border-radius: 10px;
    text-align: center;
}

.card img {
    width: 100%;
    height: 120px;
    object-fit: cover;
    border-radius: 10px;
}

button {
    background: #00ffcc;
    border: none;
    padding: 8px;
    margin-top: 5px;
    cursor: pointer;
    border-radius: 5px;
}
</style>

</head>

<body>

<div class="overlay">

<header>
<h1>Aditya Medico</h1>
<p>Your Trusted Medical Store</p>
</header>

<div class="info">
<p><b>📞 Phone:</b> 8825253574</p>
<p><b>📍 Address:</b> Behind Pal Satabdi Mall, Windsome Park Rd, Saguna More, Danapur, Patna - 801503</p>
</div>

<h2 style="text-align:center;">Medicines</h2>

<div class="products">

<div class="card">
<img src="https://via.placeholder.com/150">
<p>Paracetamol</p>
<button>Order</button>
</div>

<div class="card">
<img src="https://via.placeholder.com/150">
<p>Cough Syrup</p>
<button>Order</button>
</div>

<div class="card">
<img src="https://via.placeholder.com/150">
<p>Vitamin Tablets</p>
<button>Order</button>
</div>

<div class="card">
<img src="https://via.placeholder.com/150">
<p>Injection</p>
<button>Order</button>
</div>

</div>

</div>

</body>
</html>
