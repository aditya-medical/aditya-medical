<!DOCTYPE html>
<html>
<head>
  <title>Aditya Medico</title>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)),
      url("https://images.unsplash.com/photo-1580281657527-47e4b7d81b92");
      background-size: cover;
      color: white;
    }

    header {
      text-align: center;
      padding: 20px;
      background: rgba(0,0,0,0.85);
    }

    header h1 {
      margin: 5px;
      font-size: 28px;
    }

    .container {
      padding: 20px;
    }

    .card {
      background: rgba(255,255,255,0.1);
      padding: 20px;
      margin: 15px 0;
      border-radius: 12px;
      backdrop-filter: blur(5px);
    }

    input {
      padding: 12px;
      margin: 8px 0;
      width: 95%;
      border-radius: 6px;
      border: none;
    }

    button {
      padding: 12px;
      background: #00c853;
      color: white;
      border: none;
      border-radius: 6px;
      margin-top: 10px;
      cursor: pointer;
      width: 100%;
      font-size: 15px;
    }

    button:hover {
      background: #009624;
    }

    h2 {
      color: #00ffcc;
    }

    ul {
      padding-left: 20px;
    }
  </style>

</head>

<body>

<header>
  <h1>🏥 Aditya Medico</h1>
  <p>📞 8825253574</p>
  <p>📍 Saguna More, Danapur, Patna</p>
</header>

<div class="container">

  <!-- ORDER -->
  <div class="card">
    <h2>🛒 Order Medicine</h2>
    <input id="name" placeholder="Your Name">
    <input id="address" placeholder="Your Address">
    <input id="medicine" placeholder="Medicine Name">

    <button onclick="order()">Place Order</button>

    <a id="waLink" target="_blank">
      <button>📲 Order on WhatsApp</button>
    </a>
  </div>

  <!-- MEDICINES -->
  <div class="card">
    <h2>💊 Available Medicines</h2>
    <ul>
      <li>Dolo 650</li>
      <li>Paracetamol</li>
      <li>Cough Syrup</li>
      <li>Vitamin Tablets</li>
      <li>ORS</li>
      <li>Calcium</li>
    </ul>
  </div>

  <!-- HOME SERVICE -->
  <div class="card">
    <h2>🏠 Home Service</h2>
    <p>✔ Injection (Sui)</p>
    <p>✔ IV Drip (Pani chadhana)</p>
    <p>✔ Basic Nursing</p>
  </div>

  <!-- BILL -->
  <div class="card">
    <h2>🧾 Generate Bill</h2>
    <input id="billName" placeholder="Customer Name">
    <input id="billMed" placeholder="Medicine">
    <input id="billPrice" placeholder="Price">
    <button onclick="bill()">Generate Bill</button>
    <p id="output"></p>
  </div>

</div>

<script>

function order(){
  let name = document.getElementById("name").value;
  let address = document.getElementById("address").value;
  let med = document.getElementById("medicine").value;

  if(name==""||address==""||med==""){
    alert("Sab details bhar bhai!");
    return;
  }

  alert("✅ Order Placed!");

  let msg = "New Order%0AName: "+name+"%0AAddress: "+address+"%0AMedicine: "+med;
  let link = "https://wa.me/918825253574?text=" + msg;

  document.getElementById("waLink").href = link;
}

function bill(){
  let n = document.getElementById("billName").value;
  let m = document.getElementById("billMed").value;
  let p = document.getElementById("billPrice").value;

  if(n==""||m==""||p==""){
    alert("Sab fill karo!");
    return;
  }

  document.getElementById("output").innerHTML =
  "🧾 Customer: "+n+"<br>💊 Medicine: "+m+"<br>💰 Total: ₹"+p;
}

</script>

</body>
</html>
