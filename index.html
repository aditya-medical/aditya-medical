<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aditya Medico</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
    font-family: Arial;
    background:#eef2f3;
}

/* Header */
header{
    background:#0f9d58;
    color:white;
    text-align:center;
    padding:15px;
}

/* Banner */
.banner{
    background:#ffcc00;
    text-align:center;
    padding:10px;
    font-weight:bold;
}

/* Info */
.info{
    background:white;
    margin:10px;
    padding:10px;
    border-radius:8px;
    text-align:center;
}

/* Products */
.products{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
    gap:12px;
    padding:10px;
}

.card{
    background:white;
    border-radius:8px;
    padding:10px;
    text-align:center;
    box-shadow:0 2px 6px rgba(0,0,0,0.1);
}

.card img{
    width:100%;
    height:120px;
    object-fit:cover;
    border-radius:5px;
}

.price{
    color:green;
    font-weight:bold;
}

button{
    background:#0f9d58;
    color:white;
    border:none;
    padding:8px;
    width:100%;
    margin-top:5px;
    border-radius:5px;
    cursor:pointer;
}

/* Footer */
footer{
    background:#222;
    color:white;
    text-align:center;
    padding:10px;
}
</style>
</head>

<body>

<header>
<h1>Aditya Medico</h1>
<p>All Medicines Available</p>
</header>

<div class="banner">
🚑 24x7 Service | 💊 Home Delivery Available
</div>

<div class="info">
<p>📞 8825253574</p>
<p>📍 Behind Pal Satabdi Mall, Saguna More, Danapur, Patna</p>
</div>

<div class="products">

<div class="card">
<img src="https://via.placeholder.com/150">
<p>Paracetamol</p>
<p class="price">₹20</p>
<button onclick="order('Paracetamol')">Order</button>
</div>

<div class="card">
<img src="https://via.placeholder.com/150">
<p>Cough Syrup</p>
<p class="price">₹80</p>
<button onclick="order('Cough Syrup')">Order</button>
</div>

<div class="card">
<img src="https://via.placeholder.com/150">
<p>Vitamin Tablets</p>
<p class="price">₹120</p>
<button onclick="order('Vitamin Tablets')">Order</button>
</div>

<div class="card">
<img src="https://via.placeholder.com/150">
<p>Injection</p>
<p class="price">₹50</p>
<button onclick="order('Injection')">Order</button>
</div>

</div>

<footer>
<p>© 2026 Aditya Medico</p>
</footer>

<script>
function order(item){
    let phone = "918825253574";
    let msg = encodeURIComponent("Hello, I want to order " + item);
    window.open("https://wa.me/" + phone + "?text=" + msg);
}
</script>

</body>
</html>
