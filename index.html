<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aditya Medico</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: linear-gradient(to right, #0f2027, #203a43, #2c5364);
    color: white;
}

header {
    text-align: center;
    padding: 20px;
}

header h1 {
    color: #00ffcc;
    font-size: 32px;
}

.info {
    text-align: center;
    padding: 15px;
    background: rgba(255,255,255,0.1);
    margin: 10px;
    border-radius: 10px;
}

.products {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px,1fr));
    gap: 15px;
    padding: 15px;
}

.card {
    background: white;
    color: black;
    border-radius: 10px;
    padding: 10px;
    text-align: center;
}

.card img {
    width: 100%;
    height: 120px;
    object-fit: cover;
}

button {
    background: green;
    color: white;
    border: none;
    padding: 8px;
    width: 100%;
    margin-top: 5px;
    cursor: pointer;
    border-radius: 5px;
}

button:hover {
    background: darkgreen;
}
</style>

</head>

<body>

<header>
<h1>Aditya Medico</h1>
<p>All Medicines Available</p>
</header>

<div class="info">
<p>📞 8825253574</p>
<p>📍 Saguna More, Danapur, Patna</p>
</div>

<h2 style="text-align:center;">Products</h2>

<div class="products">

<div class="card">
<img src="https://images.unsplash.com/photo-1588776814546-ec7e7c8f6f9e">
<p>Paracetamol</p>
<button onclick="order('Paracetamol')">Order</button>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1582719478250-c89cae4dc85b">
<p>Cough Syrup</p>
<button onclick="order('Cough Syrup')">Order</button>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1585435557343-3b092031a831">
<p>Vitamin Tablets</p>
<button onclick="order('Vitamin Tablets')">Order</button>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1607619056574-7b8d3ee536b2">
<p>Injection</p>
<button onclick="order('Injection')">Order</button>
</div>

</div>

<script>
function order(item){
    let phone = "918825253574";
    let msg = "I want to order " + item;
    window.open("https://wa.me/" + phone + "?text=" + msg);
}
</script>

</body>
</html>
